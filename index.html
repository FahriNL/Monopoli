<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SteamGridDB Blacksmith</title>
<style>
  :root {
    --bg-color: #0b0f19;
    --panel-bg: rgba(20, 25, 40, 0.7);
    --primary: #00d2ff;
    --text-main: #ffffff;
    --text-muted: #8b949e;
    --border: rgba(255, 255, 255, 0.1);
  }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 0%, #1a233a 0%, #0b0f19 70%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.5rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.3);
  }

  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: -webkit-linear-gradient(#fff, #8b949e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .container {
    display: flex;
    flex-wrap: wrap;
    flex-grow: 1;
    padding: 1rem;
    gap: 1rem;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }

  /* Left Panel: Search & Assets */
  .asset-panel {
    flex: 1 1 350px;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .card {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    backdrop-filter: blur(10px);
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    color: white;
    border-radius: 8px;
    margin-bottom: 10px;
    box-sizing: border-box;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
    transition: opacity 0.2s;
  }

  button:hover { opacity: 0.9; }
  button:active { opacity: 0.7; }
  
  button.secondary {
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid var(--border);
  }

  .status {
    font-size: 0.85rem;
    color: var(--primary);
    margin-top: 10px;
    text-align: center;
    min-height: 1.2em;
  }

  /* Scrollers for fetched assets */
  .asset-scroller {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding-bottom: 10px;
    margin-top: 10px;
  }

  .asset-scroller img {
    height: 80px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.2s;
    background: #000;
  }

  .asset-scroller img:hover {
    transform: scale(1.05);
  }

  .asset-scroller img.selected {
    border-color: var(--primary);
  }

  h3 { margin: 0 0 5px 0; font-size: 1rem; color: var(--text-muted); }

  /* Right Panel: Canvas & Controls */
  .canvas-panel {
    flex: 1 1 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  /* The actual working canvas is strictly 600x900 internally, but scaled down via CSS for display */
  canvas {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 2 / 3;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  .controls {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .slider-group label {
    font-size: 0.85rem;
    display: flex;
    justify-content: space-between;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--primary);
  }

</style>
</head>
<body>

<header>
  <h1>Grid Blacksmith</h1>
</header>

<div class="container">
  
  <!-- Left Side: Searching and Asset Selection -->
  <div class="asset-panel">
    <div class="card">
      <input type="password" id="api-key" placeholder="SteamGridDB API Key (Required)">
      <input type="text" id="game-query" placeholder="Game Title (e.g., Elden Ring)">
      <button onclick="fetchGameAssets()">Fetch Assets</button>
      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <h3>1. Select Background (Hero)</h3>
      <div id="hero-scroller" class="asset-scroller">
        <div style="color: #555; font-size: 0.8rem; padding: 30px 10px;">Awaiting search...</div>
      </div>
    </div>

    <div class="card">
      <h3>2. Select Logo</h3>
      <div id="logo-scroller" class="asset-scroller">
        <div style="color: #555; font-size: 0.8rem; padding: 30px 10px;">Awaiting search...</div>
      </div>
    </div>
  </div>

  <!-- Right Side: Canvas and Positioning -->
  <div class="canvas-panel">
    <canvas id="forge-canvas" width="600" height="900"></canvas>
    
    <div class="card controls">
      <div class="slider-group">
        <label><span>Logo Size</span> <span id="size-val">80%</span></label>
        <input type="range" id="logo-size" min="20" max="150" value="80" oninput="updateCanvas()">
      </div>
      <div class="slider-group">
        <label><span>Vertical Position</span> <span id="y-val">80%</span></label>
        <input type="range" id="logo-y" min="0" max="100" value="80" oninput="updateCanvas()">
      </div>
      <button onclick="downloadGrid()" style="margin-top: 10px;">Download Custom Grid</button>
    </div>
  </div>

</div>

<script>
  const BASE_URL = "https://corsproxy.io/?https://www.steamgriddb.com/api/v2"; 
  
  // State variables
  let currentHeroImage = null;
  let currentLogoImage = null;

  // DOM Elements
  const canvas = document.getElementById('forge-canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  
  // Initial empty canvas state
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#333';
  ctx.font = '24px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Preview Area', canvas.width/2, canvas.height/2);

  // 1. Fetch data from SteamGridDB
  async function fetchGameAssets() {
    const apiKey = document.getElementById('api-key').value.trim();
    const query = document.getElementById('game-query').value.trim();

    if (!apiKey || !query) {
      statusEl.textContent = "API key and game title required.";
      return;
    }

    statusEl.textContent = "Searching for game...";
    document.getElementById('hero-scroller').innerHTML = "Loading...";
    document.getElementById('logo-scroller').innerHTML = "Loading...";

    try {
      // Get Game ID
      const searchRes = await fetch(`${BASE_URL}/search/autocomplete/${encodeURIComponent(query)}`, {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      if (!searchRes.ok) throw new Error("API Auth failed or rate limited.");
      const searchData = await searchRes.json();
      
      if (!searchData.success || searchData.data.length === 0) {
        throw new Error("Game not found.");
      }
      
      const gameId = searchData.data[0].id;
      statusEl.textContent = `Found ${searchData.data[0].name}. Fetching assets...`;

      // Fetch Heroes and Logos in parallel
      const [heroesRes, logosRes] = await Promise.all([
        fetch(`${BASE_URL}/heroes/game/${gameId}`, { headers: { 'Authorization': `Bearer ${apiKey}` } }),
        fetch(`${BASE_URL}/logos/game/${gameId}`, { headers: { 'Authorization': `Bearer ${apiKey}` } })
      ]);

      const heroesData = await heroesRes.json();
      const logosData = await logosRes.json();

      populateScroller('hero-scroller', heroesData.data, true);
      populateScroller('logo-scroller', logosData.data, false);

      statusEl.textContent = "Assets loaded. Select them to forge your grid.";

    } catch (error) {
      statusEl.textContent = error.message;
      document.getElementById('hero-scroller').innerHTML = "";
      document.getElementById('logo-scroller').innerHTML = "";
    }
  }

  // 2. Populate the asset ribbons
  function populateScroller(containerId, items, isHero) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    
    if (!items || items.length === 0) {
      container.innerHTML = `<div style="color: #555; font-size: 0.8rem;">No assets found.</div>`;
      return;
    }

    items.forEach((item, index) => {
      const img = document.createElement('img');
      img.src = item.thumb;
      img.crossOrigin = "anonymous"; // Important for canvas export
      img.dataset.fullUrl = item.url;
      
      img.onclick = () => {
        // Highlight selection
        Array.from(container.children).forEach(c => c.classList.remove('selected'));
        img.classList.add('selected');
        
        // Load the high-res image into memory for the canvas
        loadImageToCanvas(item.url, isHero);
      };
      
      container.appendChild(img);

      // Auto-select the first items
      if (index === 0) img.click();
    });
  }

  // 3. Load image object and trigger redraw
  function loadImageToCanvas(url, isHero) {
    // We route the image itself through a proxy so the canvas doesn't get tainted (which blocks download)
    const proxyUrl = `https://corsproxy.io/?${url}`;
    const imgObj = new Image();
    imgObj.crossOrigin = "anonymous";
    imgObj.onload = () => {
      if (isHero) currentHeroImage = imgObj;
      else currentLogoImage = imgObj;
      updateCanvas();
    };
    imgObj.src = proxyUrl;
  }

  // 4. Draw to Canvas
  function updateCanvas() {
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Hero (Background) - crop to fill 600x900
    if (currentHeroImage) {
      const scale = Math.max(canvas.width / currentHeroImage.width, canvas.height / currentHeroImage.height);
      const scaledWidth = currentHeroImage.width * scale;
      const scaledHeight = currentHeroImage.height * scale;
      const x = (canvas.width - scaledWidth) / 2;
      const y = (canvas.height - scaledHeight) / 2;
      ctx.drawImage(currentHeroImage, x, y, scaledWidth, scaledHeight);
    } else {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Draw Logo
    if (currentLogoImage) {
      const sizePercent = document.getElementById('logo-size').value;
      const yPercent = document.getElementById('logo-y').value;
      
      // Update labels
      document.getElementById('size-val').textContent = sizePercent + "%";
      document.getElementById('y-val').textContent = yPercent + "%";

      // Calculate Target Size (based on canvas width)
      const targetWidth = canvas.width * (sizePercent / 100);
      const aspect = currentLogoImage.height / currentLogoImage.width;
      const targetHeight = targetWidth * aspect;

      // Calculate Position
      const xPos = (canvas.width - targetWidth) / 2;
      // yPercent goes from 0 (top) to 100 (bottom of the canvas minus the logo height)
      const maxAvailableY = canvas.height - targetHeight;
      const yPos = maxAvailableY * (yPercent / 100);

      // Add a slight drop shadow to the logo to make it pop against complex backgrounds
      ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
      ctx.shadowBlur = 15;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 5;

      ctx.drawImage(currentLogoImage, xPos, yPos, targetWidth, targetHeight);
      
      // Reset shadow so it doesn't affect the next redraw
      ctx.shadowColor = "transparent";
    }
  }

  // 5. Export functionality
  function downloadGrid() {
    if (!currentHeroImage) {
      alert("Please load at least a background image first.");
      return;
    }
    
    // Convert canvas to a data URL and trigger download
    const dataURL = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = 'custom_grid_600x900.png';
    link.href = dataURL;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
</body>
</html>
