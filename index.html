<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtFetcher — SteamGridDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0a0b;
    --bg2:       #111113;
    --bg3:       #1a1a1e;
    --border:    rgba(255,170,0,0.15);
    --border2:   rgba(255,170,0,0.08);
    --amber:     #ffaa00;
    --amber-dim: rgba(255,170,0,0.6);
    --amber-glow:rgba(255,170,0,0.12);
    --text:      #e8e0d0;
    --muted:     #5a5650;
    --danger:    #ff4444;
    --success:   #44ff88;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
    position: relative;
  }

  /* Subtle scanlines texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* ── HEADER ─────────────────────────────── */
  header {
    padding: 1rem 1.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    background: var(--bg);
  }

  header .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--amber);
  }

  header .sub {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  header .count-badge {
    margin-left: auto;
    font-size: 0.7rem;
    color: var(--amber-dim);
    background: var(--amber-glow);
    border: 1px solid var(--border);
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-weight: 700;
    transition: opacity 0.3s;
  }

  /* ── GRID ────────────────────────────────── */
  #results-container {
    overflow-y: auto;
    padding: 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.75rem;
    align-content: start;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  #results-container::-webkit-scrollbar { width: 4px; }
  #results-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .grid-item {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
  }

  .grid-item:hover {
    border-color: var(--border);
    transform: translateY(-2px);
  }

  .grid-item:hover .item-actions { opacity: 1; }

  .grid-item img {
    width: 100%;
    display: block;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: var(--bg3);
  }

  /* Overlay actions on hover */
  .item-actions {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
    padding: 2rem 0.5rem 0.5rem;
    opacity: 0;
    transition: opacity 0.2s;
    display: flex;
    gap: 0.4rem;
  }

  .item-actions a {
    flex: 1;
    display: block;
    text-align: center;
    padding: 0.4rem 0.2rem;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-radius: 4px;
    text-decoration: none;
    transition: background 0.15s;
  }

  .btn-view {
    background: var(--amber-glow);
    border: 1px solid var(--border);
    color: var(--amber);
  }
  .btn-view:hover { background: rgba(255,170,0,0.2); }

  .btn-dl {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
  }
  .btn-dl:hover { background: rgba(255,255,255,0.15); }

  /* Style tag on card */
  .style-tag {
    position: absolute;
    top: 0.4rem;
    left: 0.4rem;
    background: rgba(0,0,0,0.75);
    border: 1px solid var(--border2);
    color: var(--amber-dim);
    font-size: 0.5rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.15rem 0.35rem;
    border-radius: 3px;
    backdrop-filter: blur(4px);
  }

  /* ── EMPTY STATE ─────────────────────────── */
  #empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    pointer-events: none;
  }

  #empty-state .icon {
    font-size: 2.5rem;
    opacity: 0.15;
  }

  #empty-state p {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ── CONTROL PANEL ───────────────────────── */
  #control-panel {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 0.75rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  /* Type selector tabs */
  .type-tabs {
    display: flex;
    gap: 0.4rem;
  }

  .type-tab {
    flex: 1;
    padding: 0.4rem 0.25rem;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 5px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .type-tab.active {
    background: var(--amber-glow);
    border-color: var(--border);
    color: var(--amber);
  }

  /* Inputs row */
  .inputs-row {
    display: grid;
    grid-template-columns: 1fr 1.8fr;
    gap: 0.5rem;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .field-label {
    font-size: 0.55rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding-left: 0.2rem;
  }

  input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 0.65rem 0.75rem;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--amber-dim); }
  input::placeholder { color: var(--muted); }

  /* Bottom row: status + search button */
  .action-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.5rem;
    align-items: center;
  }

  #status {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #status.ok   { color: var(--success); }
  #status.err  { color: var(--danger); }
  #status.busy { color: var(--amber-dim); }

  #search-btn {
    background: var(--amber);
    color: #000;
    border: none;
    padding: 0.7rem 1.4rem;
    border-radius: 6px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  #search-btn:active { opacity: 0.8; transform: scale(0.97); }
  #search-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── LOADING SKELETON ────────────────────── */
  .skeleton {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    overflow: hidden;
    aspect-ratio: 2/3;
    animation: shimmer 1.4s infinite;
    background: linear-gradient(
      90deg,
      var(--bg2) 0%,
      var(--bg3) 50%,
      var(--bg2) 100%
    );
    background-size: 200% 100%;
  }

  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position:  200% 0; }
  }

  /* ── RESPONSIVE: tiny phones ─────────────── */
  @media (max-width: 360px) {
    .inputs-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">ArtFetcher</span>
  <span class="sub">SteamGridDB</span>
  <span class="count-badge" id="count-badge" style="opacity:0">0 results</span>
</header>

<div id="results-container" style="position:relative;">
  <div id="empty-state">
    <div class="icon">◈</div>
    <p>Search for a game to load covers</p>
  </div>
</div>

<div id="control-panel">

  <!-- Art type tabs -->
  <div class="type-tabs">
    <button class="type-tab active" data-type="grids"  data-dim="600x900"  onclick="selectTab(this)">Grid</button>
    <button class="type-tab"        data-type="heroes"  data-dim=""          onclick="selectTab(this)">Hero</button>
    <button class="type-tab"        data-type="logos"   data-dim=""          onclick="selectTab(this)">Logo</button>
    <button class="type-tab"        data-type="icons"   data-dim=""          onclick="selectTab(this)">Icon</button>
    <button class="type-tab"        data-type="grids"   data-dim="920x430"   onclick="selectTab(this)">Wide</button>
  </div>

  <!-- Key + Query inputs -->
  <div class="inputs-row">
    <div class="field-group">
      <span class="field-label">API Key</span>
      <input type="password" id="api-key" placeholder="••••••••" autocomplete="off">
    </div>
    <div class="field-group">
      <span class="field-label">Game Title</span>
      <input type="text" id="game-query" placeholder="e.g. Hollow Knight" autocomplete="off">
    </div>
  </div>

  <!-- Status + Search -->
  <div class="action-row">
    <span id="status">Ready</span>
    <button id="search-btn" onclick="fetchArtwork()">Search ↵</button>
  </div>

</div>

<script>
  const BASE_URL = "https://corsproxy.io/?https://www.steamgriddb.com/api/v2";

  let activeType = "grids";
  let activeDim  = "600x900";

  function selectTab(el) {
    document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    activeType = el.dataset.type;
    activeDim  = el.dataset.dim;
  }

  function setStatus(msg, cls = '') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = cls;
  }

  function showSkeletons(n = 6) {
    const c = document.getElementById('results-container');
    c.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'skeleton';
      c.appendChild(s);
    }
  }

  function renderResults(arts) {
    const c = document.getElementById('results-container');
    c.innerHTML = '';

    if (arts.length === 0) {
      c.innerHTML = '<div id="empty-state"><div class="icon">◈</div><p>No artwork found for this type</p></div>';
      return;
    }

    arts.forEach(art => {
      const item = document.createElement('div');
      item.className = 'grid-item';

      const styleLabel = art.style || '';

      item.innerHTML = `
        ${styleLabel ? `<span class="style-tag">${styleLabel}</span>` : ''}
        <img src="${art.thumb}" alt="Artwork" loading="lazy">
        <div class="item-actions">
          <a href="${art.url}" target="_blank" class="btn-view">View</a>
          <a href="${art.url}" download class="btn-dl">Save</a>
        </div>
      `;
      c.appendChild(item);
    });

    const badge = document.getElementById('count-badge');
    badge.textContent = `${arts.length} results`;
    badge.style.opacity = '1';
  }

  async function fetchArtwork() {
    const apiKey = document.getElementById('api-key').value.trim();
    const query  = document.getElementById('game-query').value.trim();
    const btn    = document.getElementById('search-btn');

    if (!apiKey || !query) {
      setStatus('API key and title required.', 'err');
      return;
    }

    btn.disabled = true;
    showSkeletons(8);
    setStatus('Searching...', 'busy');
    document.getElementById('count-badge').style.opacity = '0';

    try {
      // Step 1 – autocomplete to get game ID
      const searchRes = await fetch(
        `${BASE_URL}/search/autocomplete/${encodeURIComponent(query)}`,
        { headers: { 'Authorization': `Bearer ${apiKey}` } }
      );

      if (searchRes.status === 401) throw new Error('Invalid API key.');
      if (!searchRes.ok)           throw new Error(`Search failed (${searchRes.status}).`);

      const searchData = await searchRes.json();

      if (!searchData.success || !searchData.data?.length) {
        setStatus('Game not found.', 'err');
        document.getElementById('results-container').innerHTML =
          '<div id="empty-state"><div class="icon">◈</div><p>Game not found in database</p></div>';
        return;
      }

      const game = searchData.data[0];
      setStatus(`Found: ${game.name}`, 'busy');

      // Step 2 – fetch the selected art type
      const dimParam = activeDim ? `?dimensions=${activeDim}` : '';
      const artRes = await fetch(
        `${BASE_URL}/${activeType}/game/${game.id}${dimParam}`,
        { headers: { 'Authorization': `Bearer ${apiKey}` } }
      );

      const artData = await artRes.json();

      if (!artData.success || !artData.data?.length) {
        setStatus('No artwork found for this type.', 'err');
        renderResults([]);
        return;
      }

      renderResults(artData.data);
      setStatus(`${game.name} · ${artData.data.length} covers`, 'ok');

    } catch (err) {
      setStatus(err.message, 'err');
      document.getElementById('results-container').innerHTML =
        '<div id="empty-state"><div class="icon">◈</div><p>Something went wrong</p></div>';
    } finally {
      btn.disabled = false;
    }
  }

  // Search on Enter key
  document.getElementById('game-query').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchArtwork();
  });
</script>
</body>
</html>
